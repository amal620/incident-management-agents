name: Incident Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workflow JSON
        run: python -m json.tool incident_management_v1.0.0.json.json > /dev/null

      - name: Verify README
        run: test -f README.md
