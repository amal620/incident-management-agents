name: FusionFlow CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
permissions:
  contents: read

jobs:
  quality-check:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Compile Python files
        run: python -m compileall -q main.py tests
      - name: Verify required project files
        run: test -f static/index.html && test -f static/style.css && test -f static/app.js && test -f RUNBOOK.md && test -f .env.example
      - name: Run tests (auth, rôles, LangGraph, SemVer, Kill Switch, Git)
        run: pytest

  smoke-test:
    name: Smoke test (l'app démarre)
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Start app and check /api/health
        env:
          ADMIN_PASSWORD: ci-only-Password-123
          DATABASE_PATH: ci-smoke.db
        run: |
          uvicorn main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/app.js

  docker-build:
    name: Docker build + run
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fusionflow-ai:ci .
      - name: Run container and check /api/health
        run: |
          docker run -d --name ff -p 8000:8000 -e ADMIN_PASSWORD=ci-only-Password-123 fusionflow-ai:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep '"status":"ok"' || (docker logs ff; exit 1)
