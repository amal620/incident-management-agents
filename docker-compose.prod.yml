# Utilisé par le workflow CD sur le serveur. Variables fournies par le workflow :
# IMAGE_REPOSITORY (ex. owner/repo) et IMAGE_TAG (ex. 1.2.0). Le fichier .env reste sur le serveur.
services:
  fusionflow-ai:
    image: ghcr.io/${IMAGE_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: fusionflow-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: data/fusionflow.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
